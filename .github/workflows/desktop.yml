name: desktop

on:
  push:
    branches: [feat/tracehealer-full-flow, feat/tracehealer-production-completion, main]
    # A release-candidate or release tag now runs the desktop matrix and the
    # release job below. Branch pushes keep behaving exactly as before.
    tags: ["v*"]
  pull_request:
    branches: [feat/tracehealer-full-flow, feat/tracehealer-production-completion, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: typecheck
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: unit tests
        run: npx vitest run --config=vitest.config.mts
      - name: typecheck
        run: npx tsc --noEmit
      - name: lint
        run: npx eslint --no-warn-ignored "lib/**/*.{ts,test.ts}" "app/**/*.{ts,tsx}" "apps/desktop/src/**/*.{ts,tsx,js,mjs}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint --no-warn-ignored "lib/**/*.{ts,test.ts}" "app/**/*.{ts,tsx}" "apps/desktop/src/**/*.{ts,tsx,js,mjs}"

  build-desktop:
    # NOTE: all artifacts produced by this workflow are UNSIGNED test builds.
    # Code signing and macOS notarization are external release blockers until
    # signing credentials are configured; nothing here claims signed output.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'macos'
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'macos'
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install Linux build dependencies (WebKitGTK/GTK + dbus for the OS keychain backend)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev
      - run: npm ci --legacy-peer-deps
      - name: install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --legacy-peer-deps
      - name: desktop typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: desktop unit tests
        working-directory: apps/desktop
        run: node --test src/*.test.mjs
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --verbose
      - name: cargo clippy (warnings denied)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
      - name: build desktop
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target == 'macos' && 'universal-apple-darwin' || matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - name: upload windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tracehealer-desktop-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - name: upload macos artifacts
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: tracehealer-desktop-macos-unsigned
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/app/*.app
          if-no-files-found: warn
      - name: upload linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: tracehealer-desktop-linux-unsigned
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn

  release-artifacts:
    # Publishes the installers produced by the three platform legs above. Nothing
    # is rebuilt here, and a merged tag still runs every build and test first.
    needs: [build-desktop]
    # Tags only. A branch push or a manual dispatch never publishes a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tracehealer-desktop-*-unsigned
          merge-multiple: true
          path: dist
      - name: checksum the final installer bundles
        # Checksums are generated after packaging, over the downloaded bundles
        # only, so they always describe the files users download. The script
        # fails loudly if no installer is present, if a path collides, or if an
        # installer is a symlink. Node built-ins only, so this runs identically
        # on any runner.
        run: node scripts/generate-release-checksums.mjs dist
      - name: attach release assets
        uses: softprops/action-gh-release@v2
        with:
          # A "-rc" tag publishes as a prerelease; a plain vX.Y.Z tag publishes
          # normally. Signing credentials are not configured in this repository,
          # so every asset here is unsigned and nothing below claims otherwise.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/SHA256SUMS.txt
          body: |
            PREVIEW / UNSIGNED build of TraceHealer. These installers are not code
            signed and the macOS disk image is not notarized.

            - Windows may show a SmartScreen warning; macOS Gatekeeper may block
              the app until you explicitly allow it in System Settings.
            - The Linux packages are preview builds.
            - There is no auto-updater in this build, so nothing installs an
              update on its own.
            - External sign-in (OIDC) and the sponsor-provider integrations are
              unconfigured unless a separate deployment says otherwise.
            - Verify `SHA256SUMS.txt` before running any installer.
        if: ${{ !env.ACT }}
