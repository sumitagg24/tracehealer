[package]
name = "tracehealer-desktop"
version = "0.1.0"
description = "TraceHealer desktop client"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
open = { version = "5", default-features = false }
rand = { version = "0.8", features = ["std", "std_rng"] }
sha2 = { version = "0.10", default-features = false }
# `Engine::encode` (RFC 7636 PKCE strings) needs the allocating engine, which the
# default-features-off build otherwise leaves out.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# TLS for the token exchange and authenticated server calls. On Windows this is
# SChannel and on macOS Secure Transport, so no C toolchain is required to build.
native-tls = "0.2"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
