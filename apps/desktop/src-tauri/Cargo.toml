[package]
name = "tracehealer-desktop"
version = "0.1.0"
description = "TraceHealer desktop client"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
open = { version = "5", default-features = false }
rand = { version = "0.8", features = ["std", "std_rng"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
